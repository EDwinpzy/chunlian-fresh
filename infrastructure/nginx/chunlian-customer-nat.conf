# Temporary customer-only HTTP origin used while Cloudflare Tunnel egress is unavailable.
# The provider NAT forwards its generated public TCP port to internal port 8098.
server {
    listen 8098;
    server_name _;

    access_log /var/log/chunlian/access.log;
    error_log /var/log/chunlian/error.log warn;
    client_max_body_size 10m;

    # The NAT fallback must not expose merchant, administration, or ShopXO routes.
    location = /downloads {
        limit_except GET HEAD { deny all; }
        return 308 /downloads/;
    }

    location ^~ /downloads/ {
        limit_except GET HEAD { deny all; }
        proxy_pass http://127.0.0.1:8097;
        proxy_set_header Host 127.0.0.1:8097;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Host $http_x_forwarded_host;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    }

    location = /app {
        limit_except GET HEAD { deny all; }
        return 308 /app/;
    }

    location ^~ /app/ {
        limit_except GET HEAD { deny all; }
        proxy_pass http://127.0.0.1:8097;
        proxy_set_header Host 127.0.0.1:8097;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Host $http_x_forwarded_host;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    }

    location = /api/v1/customer {
        limit_except GET HEAD POST PATCH DELETE { deny all; }
        return 308 /api/v1/customer/;
    }

    location ^~ /api/v1/customer/ {
        limit_except GET HEAD POST PATCH DELETE { deny all; }
        add_header Cache-Control "no-store" always;
        proxy_pass http://127.0.0.1:8097;
        proxy_set_header Host 127.0.0.1:8097;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Host $http_x_forwarded_host;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    }

    location ^~ /static/upload/images/ {
        limit_except GET HEAD { deny all; }
        proxy_pass http://127.0.0.1:8097;
        proxy_set_header Host 127.0.0.1:8097;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Host $http_x_forwarded_host;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    }

    location / {
        return 404;
    }
}
