# ============================================================
# 春连鲜选 (chunlian-fresh) —— Nginx 站点配置
#
# 来源：docs/DEPLOYMENT.md §6
#
# 部署位置（Debian/Ubuntu）：/etc/nginx/sites-available/chunlian.conf
# 启用：ln -s /etc/nginx/sites-available/chunlian.conf /etc/nginx/sites-enabled/
#
# ⚠️  本文件尚未启用 HTTPS：TLS 证书需域名解析生效后由 certbot 申请。
#     上线前必须：
#       1. 将 server_name 换成你的真实域名
#       2. 运行 certbot --nginx -d <域名> 自动改写为 443 + 跳转
#       3. 确认 HSTS 生效
# ============================================================

# ------------------------------------------------------------
# 后端上游：PHP-FPM
# ------------------------------------------------------------
upstream chunlian_php {
    server unix:/run/php/php8.3-fpm.sock;
}

# ------------------------------------------------------------
# 主站：ShopXO 商城 + 扩展 API
# ------------------------------------------------------------
server {
    listen 8095;
    listen [::]:8095;

    # ⚠️ 换成正式域名后，certbot 会在此处补 :443 与 ssl 指令
    server_name _;

    # 站点根目录指向 public/ —— 绝不暴露仓库根目录
    root /var/www/chunlian/shopxo/public;
    index index.php index.html;

    charset utf-8;
    client_max_body_size 10m;

    access_log /var/log/chunlian/access.log;
    error_log  /var/log/chunlian/error.log warn;

    # --------------------------------------------------------
    # 安全：拒绝访问敏感路径与文件
    # 见 docs/DEPLOYMENT.md §6：拒绝 .env / .git / vendor /
    # runtime / *.sql / *.md
    # --------------------------------------------------------
    location ~* /(\.env|\.git|\.svn|\.hg|\.DS_Store) {
        deny all;
        return 404;
    }

    location ~* ^/(vendor|runtime|config|extend|rsakeys|sourcecode)/ {
        deny all;
        return 404;
    }

    location ~* \.(sql|md|lock|log|ini|sh|bak|old|tar|gz|zip)$ {
        deny all;
        return 404;
    }

    # --------------------------------------------------------
    # 静态资源
    # --------------------------------------------------------
    location ~* \.(jpg|jpeg|png|gif|webp|svg|ico|css|js|woff|woff2|ttf|eot)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        access_log off;
        try_files $uri =404;
    }

    # --------------------------------------------------------
    # PHP 处理
    # --------------------------------------------------------
    location ~ \.php$ {
        try_files $uri =404;

        fastcgi_pass chunlian_php;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        include fastcgi_params;

        # 支付回调不能被 PHP 超时打断
        fastcgi_read_timeout 120s;
        fastcgi_send_timeout 120s;
        fastcgi_buffer_size 128k;
        fastcgi_buffers 8 128k;
        fastcgi_busy_buffers_size 256k;

        # 传递真实 IP
        fastcgi_param REMOTE_ADDR $remote_addr;
        fastcgi_param HTTP_X_FORWARDED_FOR $proxy_add_x_forwarded_for;
    }

    # --------------------------------------------------------
    # 微信支付回调：单列限速，避免被刷
    # 见 docs/DEPLOYMENT.md §6
    #
    # 注意：必须排在下面 /api/v1/ 之前 —— 虽然 nginx 的 ^~ 前缀匹配
    # 会自动选最长匹配（/api/v1/webhook/ 比 /api/v1/ 更长），
    # 但显式写在前面更利于阅读时确认优先级。
    # --------------------------------------------------------
    location ^~ /api/v1/webhook/ {
        limit_req zone=chunlian_webhook burst=20 nodelay;
        limit_req_status 429;

        try_files $uri /index.php?$query_string;
    }

    # --------------------------------------------------------
    # 商家端 API：/api/v1/<path> → ShopXO 插件 dispatch
    #
    # 【为什么要这一层重写】
    # ShopXO 的插件分发把 URL 拆成 pluginsname/pluginscontrol/pluginsaction
    # 三段固定结构，没有 RESTful 路径参数的概念。
    # 客户端（Retrofit）用的是 /api/v1/merchant/orders/123/deliver 这类路径，
    # 若让客户端去适配框架限制，请求层会被查询串污染、且无法做参数校验。
    #
    # 这里把路径整体塞进 `path` 参数，由插件的 dispatch 动作内部路由 ——
    # 客户端保持干净的 REST 语义，框架限制被隔离在这一层。
    #
    # 注意：nginx 在 replacement 含 `?` 时仍会**追加**原查询串，
    # 因此 ?page=1&page_size=20 这类参数能正常透传。
    # --------------------------------------------------------
    location ^~ /api/v1/ {
        rewrite ^/api/v1/(.*)$ /api.php?s=/plugins/index&pluginsname=chunlianfresh&pluginscontrol=merchant&pluginsaction=dispatch&path=$1 last;
    }

    # --------------------------------------------------------
    # ShopXO 伪静态（ThinkPHP 兼容）
    # --------------------------------------------------------
    location / {
        try_files $uri $uri/ /index.php?s=$uri&$args;
    }

    # 拒绝访问隐藏文件
    location ~ /\. {
        deny all;
        return 404;
    }
}

# ------------------------------------------------------------
# 限速区域定义
# 注意：limit_req_zone 必须位于 http{} 上下文。
# 若本文件被 include 进 http{}，此处可用；
# 若放在 sites-enabled（server 级），需将下面两行移到
# /etc/nginx/nginx.conf 的 http{} 内。
# ------------------------------------------------------------
limit_req_zone $binary_remote_addr zone=chunlian_webhook:10m rate=5r/s;
