# ============================================================
# 春连鲜选 (chunlian-fresh) —— Nginx 站点配置
#
# 来源：docs/DEPLOYMENT.md §6
#
# 部署位置（Debian/Ubuntu）：/etc/nginx/sites-available/chunlian.conf
# 启用：ln -s /etc/nginx/sites-available/chunlian.conf /etc/nginx/sites-enabled/
#
# HTTPS 使用项目 CA 签发的 IP 证书；公网 NAT 为 8096→8096/TCP。
# App 仅为指定 IP 信任项目 CA；网页用户须手动信任公共 CA 证书。
# 证书链和叶证书私钥位于 /etc/chunlian/tls/，CA 私钥不上传服务器。
# ============================================================

# ------------------------------------------------------------
# 后端上游：PHP-FPM
# ------------------------------------------------------------
upstream chunlian_php {
    server unix:/run/php/php8.3-fpm.sock;
}

# ------------------------------------------------------------
# 主站：ShopXO 商城 + 扩展 API
# ------------------------------------------------------------
server {
    listen 8095;
    listen [::]:8095;
    server_name _;
    return 307 https://103.236.97.137:8096$request_uri;
}

server {
    listen 8096 ssl;
    listen [::]:8096 ssl;
    # Cloudflare Workers VPC uses this HTTP listener over the encrypted Tunnel.
    # Loopback only; it is not reachable from the public network.
    listen 127.0.0.1:8097;

    ssl_certificate /etc/chunlian/tls/server-chain.pem;
    ssl_certificate_key /etc/chunlian/tls/server.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:chunlian_tls:10m;
    ssl_session_timeout 1d;

    server_name _;

    # Public traffic stays paused until local read-only release probes succeed.
    # Match the actual peer and method; forwarded headers cannot bypass this gate.
    set $chunlian_maintenance 0;
    set $chunlian_probe_peer "$remote_addr:$request_method";
    if (-f /var/www/chunlian/maintenance.flag) { set $chunlian_maintenance 1; }
    if ($chunlian_probe_peer = "127.0.0.1:GET") { set $chunlian_maintenance 0; }
    if ($chunlian_maintenance = 1) { return 503; }

    # 站点根目录指向 public/ —— 绝不暴露仓库根目录
    root /var/www/chunlian/shopxo/public;
    index index.php index.html;

    charset utf-8;
    client_max_body_size 10m;

    access_log /var/log/chunlian/access.log;
    error_log  /var/log/chunlian/error.log warn;

    # --------------------------------------------------------
    # 安全：拒绝访问敏感路径与文件
    # 见 docs/DEPLOYMENT.md §6：拒绝 .env / .git / vendor /
    # runtime / *.sql / *.md
    # --------------------------------------------------------
    location ~* /(\.env|\.git|\.svn|\.hg|\.DS_Store) {
        deny all;
        return 404;
    }

    location ~* ^/(vendor|runtime|config|extend|rsakeys|sourcecode)/ {
        deny all;
        return 404;
    }

    location ~* \.(sql|md|lock|log|ini|sh|bak|old|tar|gz|zip)$ {
        deny all;
        return 404;
    }

    # --------------------------------------------------------
    # 静态资源
    # --------------------------------------------------------
    location ~* \.(jpg|jpeg|png|gif|webp|svg|ico|css|js|woff|woff2|ttf|eot)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        access_log off;
        try_files $uri =404;
    }

    # --------------------------------------------------------
    # PHP 处理
    # --------------------------------------------------------
    location ~ \.php$ {
        try_files $uri =404;

        fastcgi_pass chunlian_php;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        include /etc/nginx/fastcgi_params;
        fastcgi_param HTTPS $https if_not_empty;

        # 支付回调不能被 PHP 超时打断
        fastcgi_read_timeout 120s;
        fastcgi_send_timeout 120s;
        fastcgi_buffer_size 128k;
        fastcgi_buffers 8 128k;
        fastcgi_busy_buffers_size 256k;

        # 传递真实 IP
        fastcgi_param REMOTE_ADDR $remote_addr;
        fastcgi_param HTTP_X_FORWARDED_FOR $proxy_add_x_forwarded_for;
    }

    # --------------------------------------------------------
    # 微信支付回调：单列限速，避免被刷
    # 见 docs/DEPLOYMENT.md §6
    #
    # 注意：必须排在下面 /api/v1/ 之前 —— 虽然 nginx 的 ^~ 前缀匹配
    # 会自动选最长匹配（/api/v1/webhook/ 比 /api/v1/ 更长），
    # 但显式写在前面更利于阅读时确认优先级。
    # --------------------------------------------------------
    location ^~ /api/v1/webhook/ {
        limit_req zone=chunlian_webhook burst=20 nodelay;
        limit_req_status 429;

        try_files $uri /index.php?$query_string;
    }

    # --------------------------------------------------------
    # 商家端 API：/api/v1/merchant/<path> → 插件 Merchant 控制器
    #
    # 【为什么要这一层重写】
    # ShopXO 的插件分发把 URL 拆成 pluginsname/pluginscontrol/pluginsaction
    # 三段固定结构，没有 RESTful 路径参数的概念。
    # 客户端（Retrofit）用的是 /api/v1/merchant/orders/123/deliver 这类路径，
    # 若让客户端去适配框架限制，请求层会被查询串污染、且无法做参数校验。
    #
    # 这里把路径整体塞进 `path` 参数，由插件的 dispatch 动作内部路由 ——
    # 客户端保持干净的 REST 语义，框架限制被隔离在这一层。
    #
    # 注意：nginx 在 replacement 含 `?` 时仍会**追加**原查询串，
    # 因此 ?page=1&page_size=20 这类参数能正常透传。
    # --------------------------------------------------------
    location ^~ /api/v1/merchant/ {
        rewrite ^/api/v1/merchant/(.*)$ /api.php?s=/plugins/index&pluginsname=chunlianfresh&pluginscontrol=merchant&pluginsaction=dispatch&path=$1 last;
    }

    # --------------------------------------------------------
    # 顾客端 API：/api/v1/customer/<path> → 插件 Customer 控制器
    #
    # 顾客账户、商品、地址、下单和修订统一由插件分发。
    # 鉴权由控制器校验 Bearer 会话。
    # --------------------------------------------------------
    location ^~ /api/v1/customer/ {
        rewrite ^/api/v1/customer/(.*)$ /api.php?s=/plugins/index&pluginsname=chunlianfresh&pluginscontrol=customer&pluginsaction=dispatch&path=$1 last;
    }

    # --------------------------------------------------------
    # 顾客端网页版（H5 SPA）
    #
    # 部署位置：public/app/（构建产物来自 apps/customer-web/dist）
    #
    # 【为什么用 ^~ 前缀匹配而不是普通 location /】
    # 这是单页应用，/app/orders/14 这类路径在磁盘上并不存在。
    # 若交给下面的 ShopXO 伪静态（try_files ... /index.php?s=$uri），
    # 顾客在订单详情页刷新会直接看到 ShopXO 的 404。
    # 因此这里必须把未命中的路径回落到 /app/index.html，由前端路由接管。
    #
    # `^~` 会让本块**优先于**下面的正则静态资源规则 ——
    # 好处是 /app/assets/*.js 也走这里，不会因为 ShopXO 的
    # `try_files $uri =404` 规则而报错；代价是要在这里自己补缓存头。
    # --------------------------------------------------------
    location ^~ /app/ {
        add_header Cache-Control "no-cache";
        # 复用 server 级 root，因此 /app/xxx 自动映射到
        # /var/www/chunlian/shopxo/public/app/xxx。
        # 不用 alias —— alias + try_files 在嵌套场景下有已知的路径拼接陷阱。
        try_files $uri $uri/ /app/index.html;

        # 带内容哈希的构建产物可以长期缓存；index.html 不在这个列表里，
        # 因此始终会走上面的 try_files，用户不会拿着旧前端去调新接口
        location ~* \.(js|css|woff2?|ttf|png|jpg|jpeg|gif|svg|webp|ico)$ {
            expires 30d;
            add_header Cache-Control "public, immutable";
            access_log off;
            try_files $uri =404;
        }
    }

    # --------------------------------------------------------
    # ShopXO 伪静态（ThinkPHP 兼容）
    # --------------------------------------------------------
    location / {
        try_files $uri $uri/ /index.php?s=$uri&$args;
    }

    # 拒绝访问隐藏文件
    location ~ /\. {
        deny all;
        return 404;
    }
}

# ------------------------------------------------------------
# 限速区域定义
# 注意：limit_req_zone 必须位于 http{} 上下文。
# 若本文件被 include 进 http{}，此处可用；
# 若放在 sites-enabled（server 级），需将下面两行移到
# /etc/nginx/nginx.conf 的 http{} 内。
# ------------------------------------------------------------
limit_req_zone $binary_remote_addr zone=chunlian_webhook:10m rate=5r/s;
